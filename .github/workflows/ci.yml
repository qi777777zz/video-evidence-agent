name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,processing]" -c requirements.lock
      - run: python -m pytest -q --basetemp .tmp/pytest-ci
      - run: python -m compileall -q video_agent scripts evaluation
      - run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]" -c requirements.lock
      - name: Configure smoke environment
        run: |
          cp .env.example .env
          sed -i 's/^API_KEY=.*/API_KEY=ci-key/' .env
          sed -i 's/^PROCESSING_MODE=.*/PROCESSING_MODE=smoke/' .env
      - run: docker compose up -d --build --wait
      - run: python scripts/day1_smoke.py --generate --key ci-key
      - run: python scripts/day7_release_check.py --live --key ci-key
      - if: always()
        run: docker compose logs --no-color api worker temporal postgres minio redis
      - if: always()
        run: docker compose down -v
